name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run lint

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      # Keep the built client around so the smoke test can run against it.
      - name: Upload client dist
        uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: client/dist
          retention-days: 1

  smoke:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci --omit=dev

      # Restore the pre-built client dist from the build job.
      - name: Restore client dist
        uses: actions/download-artifact@v4
        with:
          name: client-dist
          path: client/dist

      # Start the server in the background and run the smoke test against it.
      - name: Start server
        run: |
          node server/index.js &
          SERVER_PID=$!
          echo "SERVER_PID=$SERVER_PID" >> $GITHUB_ENV
          # Wait for the health endpoint.
          for i in $(seq 1 40); do
            if curl -s http://localhost:4000/api/health >/dev/null 2>&1; then
              echo "server ready"
              break
            fi
            sleep 0.5
          done

      - name: Run smoke tests
        run: npm run test:smoke
        env:
          BASE_URL: http://localhost:4000

      - name: Stop server
        if: always()
        run: kill ${{ env.SERVER_PID }} 2>/dev/null || true
